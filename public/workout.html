<!doctype html>
<meta charset="utf-8">
<title>Workout Meter</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap">
<style>
  :root { --ink: #1E1E2E; --paper: #FFF8E7; --brick: #C8553D; }
  html, body { margin: 0; background: transparent; font-family: 'Silkscreen', monospace; }
  /* OBS browser source: 600x160 */
  .card { box-sizing: border-box; width: 560px; margin: 12px 16px; padding: 10px 16px; background: var(--paper); color: var(--ink);
          border: 4px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); }
  .top { display: flex; justify-content: space-between; font-size: 18px; }
  .bar { height: 18px; border: 3px solid var(--ink); margin-top: 8px;
         background: repeating-linear-gradient(90deg, transparent 0 22px, rgba(30,30,46,.12) 22px 24px); }
  .fill { height: 100%; width: 0; background: var(--brick); transition: width .6s steps(12); }
  .meta { font-size: 13px; margin-top: 6px; opacity: .8; }
  .now { display: none; font-size: 26px; text-align: center; padding: 6px 0; animation: pop 1s steps(2) infinite; }
  .card.firing .now { display: block; } .card.firing .top, .card.firing .bar, .card.firing .meta { display: none; }
  .card.off { opacity: .5; }
  @keyframes pop { 50% { transform: scale(1.04); } }
</style>
<div class="card" id="card">
  <div class="top"><span>🏋️ WORKOUT METER</span><span id="count"></span></div>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div class="meta" id="meta"></div>
  <div class="now" id="now"></div>
</div>
<script type="module">
  import { LADDER } from '/lib/workout.ts';
  const $ = (id) => document.getElementById(id);
  let boot = null, firingUntil = 0;
  const render = (g) => {
    const next = LADDER[g.tier];
    $('count').textContent = `${g.meter}/${next.cost} 🧱`;
    $('fill').style.width = `${Math.min(100, (g.meter / next.cost) * 100)}%`;
    $('meta').textContent = g.enabled
      ? `next: ${next.name}${g.pending ? ` · ${g.pending} queued for the break` : ''} · !workout 20`
      : 'paused';
    $('card').classList.toggle('off', !g.enabled);
  };
  new EventSource('/events').onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'workout') {
      $('now').textContent = `💪 ${msg.name.toUpperCase()}!`;
      $('card').classList.add('firing');
      firingUntil = Date.now() + 2 * 60_000;
      setTimeout(() => Date.now() >= firingUntil && $('card').classList.remove('firing'), 2 * 60_000);
    }
    if (msg.type !== 'state') return;
    if (msg.boot && boot && msg.boot !== boot) return location.reload();
    boot = msg.boot ?? boot;
    if (msg.gym) render(msg.gym);
  };
</script>
