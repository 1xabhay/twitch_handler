<!doctype html>
<meta charset="utf-8">
<title>Now Playing</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap">
<style>
  :root { --ink: #1E1E2E; --paper: #FFF8E7; --accent: #2EC4B6; }
  html, body { margin: 0; background: transparent; font-family: 'Silkscreen', monospace; }
  /* OBS browser source: 600x140. Hidden when nothing plays. */
  .card { box-sizing: border-box; display: none; align-items: center; gap: 14px; width: 560px; margin: 12px 16px; padding: 10px 14px;
          background: var(--paper); color: var(--ink); border: 4px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); }
  .card.on { display: flex; }
  img { width: 72px; height: 72px; border: 3px solid var(--ink); image-rendering: pixelated; }
  .label { font-size: 12px; background: var(--accent); border: 2px solid var(--ink); padding: 1px 6px; }
  .title { font-size: 22px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 430px; }
  .artist { font-size: 14px; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 430px; }
</style>
<div class="card" id="card">
  <img id="art" alt="">
  <div><span class="label">♪ NOW PLAYING · !sr TO REQUEST</span><div class="title" id="title"></div><div class="artist" id="artist"></div></div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  let boot = null;
  new EventSource('/events').onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type !== 'state') return;
    if (msg.boot && boot && msg.boot !== boot) return location.reload();
    boot = msg.boot ?? boot;
    const s = msg.song;
    $('card').classList.toggle('on', !!s);
    if (!s) return;
    $('title').textContent = s.name;
    $('artist').textContent = s.artists.join(', ');
    $('art').src = s.art ?? '';
  };
</script>
