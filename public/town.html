<!doctype html>
<meta charset="utf-8">
<title>Pixel Town</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  /* Draw at 480x270, scale up 4x to 1920x1080 with hard pixel edges. */
  canvas { width: 100vw; height: 100vh; image-rendering: pixelated; }
</style>
<canvas width="480" height="270"></canvas>
<script type="module">
  import { catRoof, drift, hash, phaseAt, seasonOf, weatherOn } from '/lib/scene/ambient.ts';
  import { stepWalker } from '/lib/scene/crowd.ts';
  import { cityLayout, FH, GAP } from '/lib/scene/city.ts';

  const ctx = document.querySelector('canvas').getContext('2d');
  const WIDTH = 480, GROUND = 262, W = 16;
  const params = new URLSearchParams(location.search);
  const SKY = params.get('sky') !== '0'; // ?sky=0 → town only, no backdrop
  ctx.canvas.style.opacity = params.get('alpha') ?? '1'; // ?alpha=0.7 → whole overlay see-through
  const SKY_ALPHA = 0.5; // the sky is a faint tint over the camera; the city itself is solid
  const ROW_RISE = 10, ROW_SHIFT = 13; // back rows sit higher and shifted into the gaps: a skyline
  const C = {
    wall: '#6B5E7A', slab: '#463D52', dark: '#22202B', lit: '#FFD27A', shine: '#FFF1C1',
    hazard: '#F2C230', hazardDark: '#1E1E1E', scaffold: '#B08850', beacon: '#FF8A3D', garden: '#5FA55A',
    street: '#3B3B4F', hat: '#F2C230', vest: '#FF8A3D', skin: '#E8B796', legs: '#3A4A6B', cat: '#1E1E24',
  };
  const SKIES = {
    night: ['#0B1026', '#1C2448'], dawn: ['#3A3F7A', '#F2A07B'], day: ['#5FA8E8', '#BFE3FF'], dusk: ['#2B2D5C', '#E8735A'],
  };
  const LEAVES = { spring: '#8FD18F', summer: '#3E8E41', autumn: '#D9822B', winter: null };
  const FLAGS = ['#E4572E', '#4C9AFF', '#F4F4F4', '#C77DFF', '#2EC4B6', '#FF6F91'];
  const px = (x, y, w, h, color) => { ctx.fillStyle = color; ctx.fillRect(Math.round(x), Math.round(y), w, h); };

  // --- buildings -----------------------------------------------------------
  const scaffolding = (x, y, t) => { // under construction: shell, poles + brace, hazard band, slow beacon
    px(x, y, W, FH, C.dark);
    px(x + 1, y, 1, FH, C.wall); px(x + 14, y, 1, FH, C.wall); px(x + 1, y + 7, 14, 1, C.wall);
    for (let i = 0; i < W; i += 4) { px(x + i, y, 2, 1, C.hazard); px(x + i + 2, y, 2, 1, C.hazardDark); }
    px(x, y, 1, FH, C.scaffold); px(x + 15, y, 1, FH, C.scaffold);
    for (let j = 0; j < 6; j++) px(x + 1 + j, y + 6 - j, 1, 1, C.scaffold);
    if (Math.floor(t / 750) % 2 === 0) px(x + 15, y - 1, 1, 1, C.beacon);
  };
  const finished = (x, y) => { // done: solid wall, lit windows
    px(x, y, W, FH, C.wall); px(x, y + 7, W, 1, C.slab);
    for (const wx of [3, 7, 11]) { px(x + wx, y + 2, 2, 3, C.lit); px(x + wx, y + 2, 1, 1, C.shine); }
  };
  const roof = (x, y, name, t) => { // complete: roof cap, garden, owner's flag
    px(x, y - 2, W, 2, C.slab);
    for (const gx of [2, 3, 5]) px(x + gx, y - 3, 1, 1, C.garden);
    px(x + 11, y - 6, 1, 4, C.slab);
    const flag = FLAGS[hash(name) % FLAGS.length];
    if (Math.floor(t / 500) % 2 === 0) px(x + 12, y - 6, 3, 2, flag);
    else { px(x + 12, y - 6, 2, 2, flag); px(x + 14, y - 5, 1, 1, flag); }
  };

  const scaffoldBox = (x, y, w, h, t) => { // any lot under construction: shell, poles, planks, brace, hazard band
    px(x, y - h, w, h, C.dark);
    for (let i = 0; i < w; i += 6) px(x + i, y - h, 1, h, C.scaffold);
    px(x + w - 1, y - h, 1, h, C.scaffold);
    for (let j = 6; j < h; j += 6) px(x, y - j, w, 1, C.scaffold);
    for (let j = 0; j < Math.min(w, h) - 1; j++) px(x + 1 + j, y - 1 - j, 1, 1, C.wall);
    for (let i = 0; i < w; i += 4) { px(x + i, y - h, 2, 1, C.hazard); px(x + i + 2, y - h, 2, 1, C.hazardDark); }
    if (Math.floor(t / 750) % 2 === 0) px(x + w - 1, y - h - 1, 1, 1, C.beacon);
  };
  // finished SimCity-style lots, drawn from the ground line y up; shapes carry meaning, not just colour
  const glass = (night) => (night ? C.lit : '#9FC4E0');
  const LOTS = {
    shop: (x, y, t, night) => { // striped awning, shop window, door
      px(x, y - 10, 16, 10, '#C9A27A');
      for (let i = 0; i < 16; i += 2) px(x + i, y - 12, 2, 2, i % 4 ? '#F4F4F4' : '#E4572E');
      px(x + 2, y - 8, 7, 5, glass(night)); px(x + 11, y - 7, 3, 7, C.dark);
    },
    factory: (x, y, t, night) => { // sawtooth roof, smokestack with slow puffs
      px(x, y - 12, 18, 12, '#7A6A5A');
      for (let i = 0; i < 18; i += 6) { px(x + i, y - 13, 5, 1, '#5A4A42'); px(x + i, y - 14, 3, 1, '#5A4A42'); }
      for (let i = 0; i < 3; i++) px(x + 2 + i * 5, y - 8, 3, 2, glass(night));
      px(x + 19, y - 22, 3, 22, '#5A4A42'); px(x + 19, y - 20, 3, 1, '#E4572E');
      for (let k = 0; k < 3; k++) {
        const p = (t / 3000 + k / 3) % 1;
        ctx.fillStyle = `rgba(225,225,225,${(1 - p) * 0.8})`; ctx.fillRect(Math.round(x + 20 + p * 5), Math.round(y - 25 - p * 12), 2, 2);
      }
    },
    watertower: (x, y) => { // tank on legs
      px(x + 2, y - 12, 1, 12, '#6E8796'); px(x + 9, y - 12, 1, 12, '#6E8796'); px(x + 2, y - 7, 8, 1, '#6E8796');
      px(x + 1, y - 20, 10, 8, '#9FB8C8'); px(x + 1, y - 16, 10, 1, '#6E8796'); px(x + 2, y - 22, 8, 2, '#6E8796');
    },
    turbine: (x, y, t) => { // wind turbine, blades turn slowly
      px(x + 6, y - 22, 1, 22, '#E8E8E8');
      if (Math.floor(t / 600) % 2) { px(x + 6, y - 28, 1, 6, '#F4F4F4'); px(x + 1, y - 22, 5, 1, '#F4F4F4'); px(x + 7, y - 22, 5, 1, '#F4F4F4'); }
      else for (let i = 1; i < 5; i++) { px(x + 6 - i, y - 22 - i, 1, 1, '#F4F4F4'); px(x + 6 + i, y - 22 - i, 1, 1, '#F4F4F4'); px(x + 6 + i, y - 22 + i, 1, 1, '#F4F4F4'); }
    },
    fountain: (x, y, t) => { // plaza with a bubbling fountain and two bushes
      px(x, y - 1, 16, 1, '#B8B0A0'); px(x + 3, y - 3, 10, 2, '#8A8A9A'); px(x + 4, y - 3, 8, 1, '#7FC8F8');
      const f = Math.floor(t / 400) % 2;
      px(x + 7, y - 7 + f, 2, 4 - f, '#BFE3FF'); px(x + 5, y - 6 + f, 1, 1, '#BFE3FF'); px(x + 10, y - 6 + f, 1, 1, '#BFE3FF');
      px(x, y - 3, 2, 2, C.garden); px(x + 14, y - 3, 2, 2, C.garden);
    },
    school: (x, y, t, night) => { // brick block, bell tower with clock
      px(x, y - 12, 24, 12, '#B5523B'); px(x - 1, y - 13, 26, 1, C.slab);
      px(x + 9, y - 18, 6, 5, '#B5523B'); px(x + 10, y - 19, 4, 1, C.slab); px(x + 11, y - 17, 2, 2, '#F4F4F4');
      for (const wx of [2, 6, 16, 20]) px(x + wx, y - 9, 2, 3, glass(night));
      px(x + 10, y - 5, 4, 5, C.dark);
    },
    hospital: (x, y, t, night) => { // white block, big cross
      px(x, y - 18, 20, 18, '#E8E8EC');
      px(x + 9, y - 16, 2, 6, '#E4572E'); px(x + 7, y - 14, 6, 2, '#E4572E');
      for (const wx of [2, 6, 12, 16]) px(x + wx, y - 8, 2, 2, glass(night));
      px(x + 8, y - 4, 4, 4, '#9FC4E0');
    },
    stadium: (x, y, t, night) => { // seating bowl and floodlights
      px(x, y - 8, 32, 8, '#8A8A9A'); px(x + 2, y - 10, 28, 2, '#A8A8B8');
      for (let i = 4; i < 28; i += 3) px(x + i, y - 6, 2, 1, FLAGS[i % FLAGS.length]);
      for (const lx of [0, 31]) { px(x + lx, y - 14, 1, 6, '#5A5A6A'); px(x + lx - 1, y - 15, 3, 1, night ? C.shine : '#DDDDDD'); }
    },
  };

  const house = (x, y, night) => { // filler: little two-storey house with a pitched roof
    px(x + 2, y - 10, 12, 10, '#8C6F5A'); px(x + 7, y - 5, 2, 5, C.dark);
    for (let i = 0; i < 4; i++) px(x + 1 + i, y - 11 - i, 14 - 2 * i, 1, '#9C4A3A');
    px(x + 4, y - 8, 2, 2, night ? C.lit : '#BFE3FF'); px(x + 10, y - 8, 2, 2, night ? C.lit : '#BFE3FF');
  };
  const park = (x, y, season) => { // filler: two trees and a bench
    tree(x, season, y); tree(x + 10, season, y);
    px(x + 5, y - 2, 5, 1, '#6B4A2B'); px(x + 5, y - 1, 1, 1, '#6B4A2B'); px(x + 9, y - 1, 1, 1, '#6B4A2B');
  };

  // --- ambient -------------------------------------------------------------
  const sky = (top, phase, weather, t) => {
    const g = ctx.createLinearGradient(0, top, 0, GROUND);
    g.addColorStop(0, SKIES[phase][0]); g.addColorStop(1, SKIES[phase][1]);
    ctx.fillStyle = g; ctx.fillRect(0, top, WIDTH, GROUND - top);
    if (phase === 'night') {
      for (let i = 0; i < 40; i++) {
        const sx = hash('sx' + i) % WIDTH, sy = top + (hash('sy' + i) % (GROUND - top - 20));
        if ((Math.floor(t / 1500) + i) % 9) px(sx, sy, 1, 1, '#FFFFFF'); // gentle twinkle
      }
      const mx = WIDTH - 60, my = top + 8; // crescent moon
      px(mx + 1, my, 3, 1, '#F4F1DE'); px(mx, my + 1, 5, 3, '#F4F1DE'); px(mx + 1, my + 4, 3, 1, '#F4F1DE');
      px(mx + 2, my + 1, 3, 3, SKIES.night[0]);
    }
    if (phase === 'day') px(WIDTH - 60, top + 8, 6, 6, '#FFE38A');
    if (weather === 'clear' || phase === 'night') {
      for (let i = 0; i < 3; i++) { // clouds
        const cx = drift(i + 1, t, WIDTH, 2 + i), cy = top + 6 + i * 9;
        const shade = phase === 'night' ? '#2A3260' : '#FFFFFF';
        px(cx, cy + 2, 14, 3, shade); px(cx + 3, cy, 7, 2, shade);
      }
    } else {
      px(0, top, WIDTH, 10, '#8A93A8'); // overcast band
    }
    if (phase === 'day' && Math.floor(t / 45_000) % 3 === 0) { // a bird now and then
      const bx = drift(9, t, WIDTH, 25), by = top + 14, up = Math.floor(t / 300) % 2;
      px(bx, by + up, 1, 1, '#2A2A3A'); px(bx + 1, by + 1, 1, 1, '#2A2A3A'); px(bx + 2, by + up, 1, 1, '#2A2A3A');
    }
    if (weather !== 'clear') {
      for (let i = 0; i < 60; i++) {
        const fall = weather === 'rain' ? 120 : 15;
        const x = (hash('wx' + i) + (weather === 'snow' ? Math.sin(t / 900 + i) * 3 : 0)) % WIDTH;
        const y = top + (((hash('wy' + i) + (t / 1000) * fall) % (GROUND - top)));
        weather === 'rain' ? px(x, y, 1, 3, '#9FB8D8') : px(x, y, 1, 1, '#FFFFFF');
      }
    }
  };
  const tree = (x, season, y = GROUND) => {
    px(x + 2, y - 4, 1, 4, '#6B4A2B');
    const leaves = LEAVES[season];
    if (leaves) { px(x, y - 9, 5, 5, leaves); if (season === 'spring') px(x + 1, y - 8, 1, 1, '#F7A8C4'); }
    else px(x + 1, y - 6, 3, 1, '#F4F4F4'); // bare branch with snow
  };
  const lamp = (x, on) => {
    px(x, GROUND - 8, 1, 8, '#2A2A3A'); px(x - 1, GROUND - 9, 3, 1, '#2A2A3A');
    if (on) { ctx.fillStyle = 'rgba(255,210,122,0.25)'; ctx.fillRect(x - 3, GROUND - 9, 7, 9); px(x, GROUND - 8, 1, 1, C.lit); }
  };
  const cat = (x, y, t) => {
    px(x, y - 2, 4, 2, C.cat); px(x, y - 3, 1, 1, C.cat); px(x + 2, y - 3, 1, 1, C.cat); // body + ears
    px(x + 4, y - (Math.floor(t / 2500) % 4 === 0 ? 3 : 1), 1, 1, C.cat); // tail flick now and then
  };

  // --- builders, trucks, buses ---------------------------------------------
  const builderSprite = (x, mode, t, jump = 0) => {
    const y = GROUND - 7 - jump, step = mode === 'walk' && Math.floor(t / 200) % 2;
    px(x, y, 3, 1, C.hat); px(x, y + 1, 3, 2, C.skin); px(x, y + 3, 3, 2, C.vest);
    px(x, y + 5, 1, 2, C.legs); px(x + 2, y + 5 + (step ? -1 : 0), 1, 2, C.legs);
    if (mode === 'hammer') px(x + 3, y + 2 + (Math.floor(t / 250) % 2), 1, 1, '#9A9A9A');
  };
  const vehicle = (x, color, long) => {
    const len = long ? 22 : 14;
    px(x, GROUND - 7, len, 5, color); px(x + len - 4, GROUND - 6, 3, 2, '#BFE3FF');
    if (long) for (let i = 2; i < len - 6; i += 4) px(x + i, GROUND - 6, 2, 2, '#BFE3FF');
    px(x + 2, GROUND - 2, 2, 2, '#1E1E1E'); px(x + len - 5, GROUND - 2, 2, 2, '#1E1E1E');
  };

  // --- state ---------------------------------------------------------------
  let town = {}, builders = [], sunPhase = null;
  const walkers = new Map();   // id -> Walker
  const doneCounts = new Map(); // id -> finished floors, to spot a fresh !done and jump
  const jumps = new Map();      // id -> jump until (ms)
  const visitors = [];          // { x, kind: 'truck'|'bus', name, raiders, phase }
  const raiders = [];           // anonymous builders that came with a raid: { w, until }

  const onState = (msg, now) => {
    for (const [id, b] of Object.entries(msg.town)) {
      const n = b.floors.filter((f) => f.done).length;
      if (doneCounts.has(id) && n > doneCounts.get(id)) jumps.set(id, now + 1200);
      doneCounts.set(id, n);
    }
    town = msg.town; builders = msg.builders; sunPhase = msg.phase ?? null;
  };

  let last = performance.now();
  const frame = (t) => {
    const dt = Math.min(t - last, 500); last = t;
    const nowDate = new Date(), phase = sunPhase ?? phaseAt(nowDate.getHours()), season = seasonOf(nowDate.getMonth());
    const weather = weatherOn(nowDate.toLocaleDateString('en-CA'), season);
    const lots = cityLayout(town, WIDTH - 16 - ROW_SHIFT);
    const xOf = (l) => 8 + l.x + (l.row % 2 ? ROW_SHIFT : 0);
    const baseOf = (l) => GROUND - l.row * ROW_RISE;
    const rows = Math.max(0, ...lots.map((l) => l.row));
    const front = lots.filter((l) => l.kind === 'tower' && l.row === 0);

    ctx.clearRect(0, 0, WIDTH, 270);
    // the sky opens up as the city rises: it starts just above the rooftops and grows with the tallest tower
    const skyline = Math.max(0, ...lots.map((l) => l.row * ROW_RISE + l.h));
    if (SKY) { ctx.globalAlpha = SKY_ALPHA; sky(Math.max(0, GROUND - skyline - 30), phase, weather, t); ctx.globalAlpha = 1; }
    px(0, GROUND, WIDTH, 8, C.street);

    // ponytail: rows stack ~10px each; past ~5 rows (90 towers) the city reaches the top — add paging then.
    for (let row = rows; row >= 0; row--) {
      ctx.filter = row ? 'brightness(0.7) saturate(0.8)' : 'none'; // distance: darker, still solid
      lots.filter((l) => l.row === row).forEach((l, i) => {
        const x = xOf(l), y = baseOf(l), night = phase !== 'day';
        if (l.kind === 'house') house(x, y, night);
        else if (l.kind === 'park') park(x, y, season);
        else if (l.kind === 'tower') {
          l.floors.forEach((f, k) => (f.done ? finished : scaffolding)(x, y - (k + 1) * FH, t));
          if (l.complete) roof(x, y - l.floors.length * FH, l.name ?? l.id, t);
        } else (l.done ? LOTS[l.kind](x, y, t, night) : scaffoldBox(x, y, l.w, l.h, t));
        if (!row) (i % 2 ? lamp : (gx) => tree(gx, season))(x + l.w + 2, night);
      });
    }
    ctx.filter = 'none';
    const catAt = catRoof(front.length, Date.now());
    if (catAt !== null) {
      const l = front[catAt];
      cat(xOf(l) + 3, GROUND - l.floors.length * FH - (l.complete ? 2 : 0), t);
    }

    // builders: walk to your scaffolding and hammer, otherwise wander
    const ids = new Set(builders.map((b) => b.id));
    for (const id of walkers.keys()) if (!ids.has(id)) walkers.delete(id);
    for (const { id } of builders) {
      const site = lots.find((l) => l.id === id && (l.kind === 'tower' ? l.floors.some((f) => !f.done) : !l.done));
      const home = site ? xOf(site) + site.w / 2 - 1 : null;
      const w = walkers.get(id) ?? { x: Math.random() * WIDTH, target: 0, mode: 'idle', until: 0 };
      const next = stepWalker(w, { dt, now: t, home, rand: Math.random, width: WIDTH - 4 });
      walkers.set(id, next);
      builderSprite(next.x, next.mode, t, (jumps.get(id) ?? 0) > Date.now() ? 2 : 0);
    }
    for (let i = raiders.length - 1; i >= 0; i--) {
      const r = raiders[i];
      if (Date.now() > r.until) { raiders.splice(i, 1); continue; }
      r.w = stepWalker(r.w, { dt, now: t, home: null, rand: Math.random, width: WIDTH - 4 });
      builderSprite(r.w.x, r.w.mode, t);
    }

    // visitors: delivery truck for a follow, a bus of builders for a raid
    for (let i = visitors.length - 1; i >= 0; i--) {
      const v = visitors[i];
      if (v.kind === 'bus' && v.phase === 'arrive' && v.x >= WIDTH / 2 - 11) { // stop, unload, leave
        v.phase = 'leave';
        for (let k = 0; k < Math.min(v.raiders, 12); k++) {
          raiders.push({ w: { x: v.x + 10, target: 0, mode: 'idle', until: 0 }, until: Date.now() + 10 * 60_000 });
        }
      }
      v.x += (dt / 1000) * (v.kind === 'truck' ? 40 : 30);
      if (v.x > WIDTH + 30) { visitors.splice(i, 1); continue; }
      vehicle(v.x, v.kind === 'truck' ? '#4C9AFF' : '#F2C230', v.kind === 'bus');
    }
    requestAnimationFrame(frame);
  };

  let boot = null;
  new EventSource('/events').onmessage = (e) => {
    const msg = JSON.parse(e.data), now = Date.now();
    if (msg.boot && boot && msg.boot !== boot) return location.reload(); // bot restarted, maybe with new code
    boot = msg.boot ?? boot;
    if (msg.type === 'state') onState(msg, now);
    if (msg.type === 'follow') visitors.push({ kind: 'truck', x: -20, name: msg.name });
    if (msg.type === 'raid') visitors.push({ kind: 'bus', x: -30, name: msg.from, raiders: msg.viewers, phase: 'arrive' });
  };
  requestAnimationFrame(frame);
</script>
