<!doctype html>
<meta charset="utf-8">
<title>Pixel Town</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  /* Draw at 480x270, scale up 4x to 1920x1080 with hard pixel edges. */
  canvas { width: 100vw; height: 100vh; image-rendering: pixelated; }
</style>
<canvas width="480" height="270"></canvas>
<script type="module">
  import { carrier, catRoof, celestial, drift, hash, phaseAt, project, seasonOf, weatherOn } from '/lib/scene/ambient.ts';
  import { stepWalker } from '/lib/scene/crowd.ts';
  import { cityLayout, cityscape, farRow, oldTown, FH, FOCUS_ID, SIZE, STACKABLE, streetLife } from '/lib/scene/city.ts';
  import { current } from '/lib/focus.ts';
  import { C, kit, shade, tree } from '/lib/scene/blocks.ts';
  import { THEMES, settled, steer, tide } from '/lib/scene/theme.ts';
  import { evaluate, STREET, streetInputs } from '/lib/scene/circuit.ts';
  import { fbm, land, liftAt } from '/lib/scene/land.ts';

  const screen = document.querySelector('canvas').getContext('2d');
  // the city is drawn on its own layer, then stamped onto the screen with a dark outline: readable on white or black
  const layer = Object.assign(document.createElement('canvas'), { width: 480, height: 270 }).getContext('2d');
  const OUTLINE = ['1px 0', '-1px 0', '0 1px', '0 -1px'].map((o) => `drop-shadow(${o} 0 #0B0B12)`).join(' ');
  let ctx = screen; // drawing helpers paint wherever ctx points
  const WIDTH = 480, GROUND = 250, W = 16; // GROUND = the far riverbank; the river runs below it
  // the shoreline wanders: two slow waves, kept clear of the boat lane
  const SHORE = Array.from({ length: WIDTH }, (_, x) =>
    GROUND + Math.min(11, Math.max(2, Math.round(6 + 4.5 * Math.sin(x / 85 + 0.7) + 1.5 * Math.sin(x / 23 + 2)))));
  const BACK = 3; // the back row stands a little further off, on higher ground
  const params = new URLSearchParams(location.search);
  const SKY = params.get('sky') !== '0'; // ?sky=0 → town only, no backdrop
  ctx.canvas.style.opacity = params.get('alpha') ?? '1'; // ?alpha=0.7 → whole overlay see-through
  // The view: 'city' (default) = full screen, the old city behind and sky only above HORIZON; 'bottom' = a strip over the
  // camera, the sky a faint tint. Mods switch it with !view (state.view); ?bg= pins it: city, 0 = bottom, 1 = opaque sky, no old city.
  const HORIZON = 70, PINNED = params.get('bg');
  let BG, CITY, SKY_ALPHA;
  const setView = (v) => {
    BG = ['1', 'city'].includes(v); CITY = v === 'city';
    SKY_ALPHA = BG ? 1 : 0.5; // the city itself is always solid
  };
  setView(PINNED ?? 'city');
  const SKIES = {
    night: ['#0B1026', '#1C2448'], dawn: ['#3A3F7A', '#F2A07B'], day: ['#5FA8E8', '#BFE3FF'], dusk: ['#2B2D5C', '#E8735A'],
  };
  const px = (x, y, w, h, color) => { ctx.fillStyle = color; ctx.fillRect(Math.round(x), Math.round(y), w, h); };
  // building blocks: the plain kit, and each theme's blocks laid over it (src/scene/blocks.ts, src/scene/themes/)
  const PLAIN = kit(), KITS = Object.fromEntries(Object.entries(THEMES).map(([id, th]) => [id, kit(th.kit)]));
  const kitOf = (id) => (id && KITS[id]) || PLAIN;

  // --- buildings -----------------------------------------------------------
  // Under construction is airy and see-through; finished is solid and lit — the two states read by shape and mass.
  const AIRY = '#3E4A5E', POLE = '#C8D4E6'; // opaque: no camera showing through the city
  const beaconOn = (t, seed) => (t + seed) % 3000 < 200; // one short blink every 3 s, each site on its own beat
  const scaffolding = (x, y, t, seed) => { // one open storey (top-left x, y)
    px(x, y, W, FH, AIRY);
    px(x, y, 1, FH, POLE); px(x + 8, y, 1, FH, POLE); px(x + 15, y, 1, FH, POLE); px(x, y + 7, W, 1, POLE);
    for (let j = 0; j < 6; j++) px(x + 1 + j, y + 6 - j, 1, 1, C.scaffold);
    for (let i = 0; i < W; i += 4) { px(x + i, y, 2, 1, C.hazard); px(x + i + 2, y, 2, 1, C.hazardDark); }
    if (beaconOn(t, seed)) px(x + 15, y - 1, 1, 1, C.beacon);
  };
  const scaffoldBox = (x, y, w, h, t, seed) => { // any lot under construction, standing on ground line y
    px(x, y - h, w, h, AIRY);
    for (let i = 0; i < w; i += 6) px(x + i, y - h, 1, h, POLE);
    px(x + w - 1, y - h, 1, h, POLE);
    for (let j = 6; j < h; j += 6) px(x, y - j, w, 1, POLE);
    for (let j = 0; j < Math.min(w, h) - 1; j++) px(x + 1 + j, y - 1 - j, 1, 1, C.scaffold);
    for (let i = 0; i < w; i += 4) { px(x + i, y - h, 2, 1, C.hazard); px(x + i + 2, y - h, 2, 1, C.hazardDark); }
    if (beaconOn(t, seed)) px(x + w - 1, y - h - 1, 1, 1, C.beacon);
  };
  // "construction complete", silent and ~1.5 s: scaffold falls away bottom-up, then a glint sweeps the facade
  const reveals = new Map(); // piece key -> when it was finished (ms)
  const wheres = new Map();  // viewer id -> until (ms): !where points at their buildings
  const pointer = (cx, y, t) => { // small arrow bobbing gently above a building
    const b = y + (Math.floor(t / 600) % 2);
    px(cx, b - 3, 1, 3, '#FEE761'); px(cx - 2, b, 5, 1, '#FEE761'); px(cx - 1, b + 1, 3, 1, '#FEE761'); px(cx, b + 2, 1, 1, '#FEE761');
  };
  const reveal = (k, x, y, w, h, t, seed) => {
    if (!reveals.has(k)) return;
    const p = Date.now() - reveals.get(k);
    if (p >= 1300) return reveals.delete(k);
    if (p < 800) {
      ctx.save(); ctx.beginPath(); ctx.rect(x, y - h, w, Math.ceil(h * (1 - p / 800))); ctx.clip();
      scaffoldBox(x, y, w, h, t, seed); ctx.restore();
    } else {
      const c = ((p - 800) / 500) * (w + h);
      for (let dy = 0; dy < h; dy++) { const dx = Math.round(c - dy); if (dx >= 0 && dx < w) px(x + dx, y - h + dy, 1, 1, '#FEE761'); }
    }
  };
  // --- depth: a side wall and roof edge slanting back on the side away from the sun ------
  const D = 3; // how far back the box goes (px)
  const depth = (x, base, h, body, done, right, night) => {
    const [dx, w, , wall] = body, c = done ? wall : AIRY, top = base - h, dir = right ? 1 : -1;
    for (let i = 1; i <= D; i++) px(x + dx + dir * i, top - i, w, 1, shade(c, 0.85)); // roof edge
    const sx = right ? x + dx + w : x + dx - 1;
    for (let i = 0; i < D; i++) {
      px(sx + dir * i, top - i, 1, h, shade(c, night ? 0.45 : 0.6)); // side wall in shade
      if (done && i === 1 && h >= 16) for (let y = top + 3; y < base - 3; y += 4) px(sx + dir, y - 1, 1, 1, shade(C.lit, 0.7)); // a few side windows
    }
  };


  // --- ambient -------------------------------------------------------------
  const line = (a, b, color) => { // 1px dotted pixel line
    const n = Math.max(Math.abs(b.x - a.x), Math.abs(b.y - a.y));
    for (let i = 0; i <= n; i += 2) px(Math.round(a.x + ((b.x - a.x) * i) / n), Math.round(a.y + ((b.y - a.y) * i) / n), 1, 1, color);
  };
  // real stars (state.sky): constellation figures faint, bright stars bigger; dusk/dawn shows only the brightest
  const realStars = (box, phase, t) => {
    const pts = realSky.stars.map((s) => ({ ...project(s, box), mag: s.mag }));
    if (phase === 'night') realSky.lines.forEach(([a, b]) => line(pts[a], pts[b], 'rgba(190,205,255,0.22)'));
    pts.forEach((p, i) => {
      if (phase !== 'night' && p.mag > 1) return;
      if (p.mag < 1.5 && (Math.floor(t / 1500) + i) % 11 === 0) return; // bright ones twinkle gently
      if (p.mag < 0.5) { px(p.x - 1, p.y, 3, 1, '#DDE6FF'); px(p.x, p.y - 1, 1, 3, '#DDE6FF'); }
      px(p.x, p.y, 1, 1, p.mag < 2.5 ? '#FFFFFF' : '#B8C4E8');
    });
  };
  const sky = (top, phase, weather, t, box) => {
    const g = ctx.createLinearGradient(0, top, 0, GROUND);
    g.addColorStop(0, SKIES[phase][0]); g.addColorStop(1, SKIES[phase][1]);
    ctx.fillStyle = g; ctx.fillRect(0, top, WIDTH, GROUND - top);
    if (realSky && phase !== 'day') realStars(box, phase, t);
    else if (phase === 'night') {
      for (let i = 0; i < 40; i++) {
        const sx = hash('sx' + i) % WIDTH, sy = top + (hash('sy' + i) % (GROUND - top - 20));
        if ((Math.floor(t / 1500) + i) % 9) px(sx, sy, 1, 1, '#FFFFFF'); // gentle twinkle
      }
    }
    if (weather === 'clear' || phase === 'night') {
      for (let i = 0; i < 3; i++) { // clouds
        const cx = drift(i + 1, t, WIDTH, 2 + i), cy = top + 6 + i * 9;
        const shade = phase === 'night' ? '#2A3260' : '#FFFFFF';
        px(cx, cy + 2, 14, 3, shade); px(cx + 3, cy, 7, 2, shade);
      }
    } else {
      px(0, top, WIDTH, 10, '#8A93A8'); // overcast band
    }
    if (phase === 'day' && Math.floor(t / 45_000) % 3 === 0) { // a bird now and then
      const bx = drift(9, t, WIDTH, 25), by = top + 14, up = Math.floor(t / 300) % 2;
      px(bx, by + up, 1, 1, '#2A2A3A'); px(bx + 1, by + 1, 1, 1, '#2A2A3A'); px(bx + 2, by + up, 1, 1, '#2A2A3A');
    }
    if (weather !== 'clear') {
      for (let i = 0; i < 60; i++) {
        const fall = weather === 'rain' ? 120 : 15;
        const x = (hash('wx' + i) + (weather === 'snow' ? Math.sin(t / 900 + i) * 3 : 0)) % WIDTH;
        const y = top + (((hash('wy' + i) + (t / 1000) * fall) % (GROUND - top)));
        weather === 'rain' ? px(x, y, 1, 3, '#9FB8D8') : px(x, y, 1, 1, '#FFFFFF');
      }
    }
  };
  const lamp = (x, on) => {
    px(x, GROUND - 8, 1, 8, '#2A2A3A'); px(x - 1, GROUND - 9, 3, 1, '#2A2A3A');
    if (!on) return;
    ctx.fillStyle = 'rgba(254,174,52,0.18)'; // a soft cone of light down to the sidewalk
    ctx.fillRect(x - 1, GROUND - 8, 3, 3); ctx.fillRect(x - 2, GROUND - 5, 5, 3); ctx.fillRect(x - 3, GROUND - 2, 7, 4);
    px(x, GROUND - 8, 1, 1, C.lit);
  };
  const cat = (x, y, t) => {
    px(x, y - 2, 4, 2, C.cat); px(x, y - 3, 1, 1, C.cat); px(x + 2, y - 3, 1, 1, C.cat); // body + ears
    px(x + 4, y - (Math.floor(t / 2500) % 4 === 0 ? 3 : 1), 1, 1, C.cat); // tail flick now and then
  };

  // --- the city behind (view 'city'): the same city further back, same blocks, smaller and hazier with distance,
  // built on the day's land (src/scene/land.ts): ranges beyond, hills, cliffs, forests, fields, water. Drawn once per
  // day, phase, season and theme. ?land=alpine|coast|valley|mesa|archipelago|fjord pins the landscape (previews).
  const LAND = params.get('land');
  let today = null;
  const landOf = (date, season) => (today?.key === date + season ? today
    : (today = { key: date + season, L: land(date, WIDTH, { biome: LAND ?? undefined, season }) })).L;
  const mouthOf = (date, season) => { const m = landOf(date, season).river(1); return { x: m.x - 8 - 2, w: m.w + 4 }; }; // in street coords
  const GREEN = { spring: ['#8CC66A', '#5E9E48'], summer: ['#6FA858', '#3E7434'], autumn: ['#B8A050', '#6E7438'], winter: ['#C9D2DA', '#5A6E5A'] };
  const COVER = { sand: '#D9A066', beach: '#E6D6A6', rock: '#8A8078', snow: '#EEF2F8' };
  const FACE = { mesa: ['#B5653A', '#9A4E2C'], other: ['#7A7068', '#665E58'] }; // cliff faces, with strata
  const RANGE = { alpine: [40, 'ridge'], fjord: [34, 'ridge'], valley: [14, 'soft'], coast: [16, 'soft'], mesa: [22, 'butte'], archipelago: [8, 'isles'] };
  const mix = (a, b, f) => '#' + [1, 3, 5].map((i) =>
    Math.round(parseInt(a.slice(i, i + 2), 16) * (1 - f) + parseInt(b.slice(i, i + 2), 16) * f).toString(16).padStart(2, '0')).join('');
  const sprite = (k, p, sc, fog, haze, s) => { // one finished building at full size, hazed, then shrunk onto ctx
    const [sw, sh] = SIZE[p.kind], W = sw + 4, H = sh + p.storeys * FH + 12, keep = ctx;
    ctx = Object.assign(document.createElement('canvas'), { width: W, height: H }).getContext('2d');
    k.lots[p.kind](px, 2, H, s);
    for (let i = 0; i < p.storeys; i++) (k.storey[p.kind] ?? k.storey.office)(px, 2, H - sh - (i + 1) * FH, s);
    if (STACKABLE.has(p.kind)) k.roof(px, 2, H - sh - p.storeys * FH, p.kind, 0);
    ctx.globalCompositeOperation = 'source-atop'; ctx.globalAlpha = fog; ctx.fillStyle = haze; ctx.fillRect(0, 0, W, H);
    const img = ctx.canvas; ctx = keep;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(img, Math.round(p.x - 2 * sc), Math.round(p.y - H * sc), Math.round(W * sc), Math.round(H * sc));
  };
  // trees by landscape: pines up high and north, round crowns in valleys, palms on islands, scrub and cacti in the desert
  const wildTree = (x, y, sc, type, season, f, seed) => {
    const th = 2 + Math.round((3 + (seed % 3)) * sc * 1.6);
    if (type === 'pine') {
      const c = f(season === 'autumn' ? '#2E5A34' : '#2F5E3A');
      for (let d = 0; d < th; d++) px(x - (d >> 1), y - th + d, 1 + 2 * (d >> 1), 1, c);
      if (season === 'winter') px(x, y - th, 1, 2, f('#F4F6FA'));
    } else if (type === 'palm') {
      px(x, y - th, 1, th, f('#8A6A44')); px(x - 2, y - th, 5, 1, f('#4E9A48')); px(x - 1, y - th - 1, 3, 1, f('#5FB058'));
    } else if (type === 'scrub') {
      seed % 4 ? px(x - 1, y - 2, 3, 2, f('#7A8A4A')) : (px(x, y - th, 1, th, f('#5E8A4A')), px(x - 1, y - th + 2, 1, 2, f('#5E8A4A')));
    } else {
      if (season === 'winter') { px(x, y - th, 1, th, f('#6A5444')); px(x - 1, y - th + 1, 3, 1, f('#6A5444')); return; }
      const leaf = season === 'autumn' ? ['#C8632E', '#D9A13A', '#A84A2A'][seed % 3] : GREEN[season][1];
      px(x, y - 2, 1, 2, f('#5A4434')); px(x - 1, y - th, 3, th - 1, f(leaf)); px(x, y - th - 1, 1, 1, f(leaf));
    }
  };
  const ranges = (L, haze, night) => { // two far ranges beyond the horizon, the nearer one sharper; snow on the high ones
    const [tall, form] = RANGE[L.biome], seed = hash(L.seed + 'range');
    for (const [j, f] of [[0, 0.72], [1, 0.55]]) for (let x = 0; x < WIDTH; x++) {
      const n = fbm(seed + j * 31, x / (form === 'soft' ? 120 : 60), j * 9);
      let h = form === 'ridge' ? (1 - Math.abs(2 * n - 1)) ** 1.5 * tall : form === 'butte' ? Math.floor(n * 4) / 4 * tall
        : form === 'isles' ? Math.max(0, n - 0.55) * tall * 4 : n * tall;
      if (L.biome === 'coast') h *= Math.max(0, (hash(L.seed + ':land') % 2 ? x / WIDTH : 1 - x / WIDTH) * 1.6 - 0.3); // the sea side lies open
      h = Math.min(h * (j ? 0.8 : 1), HORIZON - 26);
      if (h < 1) continue;
      const base = form === 'butte' ? '#A86A4A' : '#6E82A0', y = HORIZON - Math.round(h);
      px(x, y, 1, Math.round(h) + 12, mix(shade(base, night ? 0.45 : 1), haze, f));
      if ((form === 'ridge' && h > tall * 0.55) || (L.season === 'winter' && form !== 'isles' && h > tall * 0.4))
        px(x, y, 1, 1 + Math.round((h - tall * 0.4) / 5), mix('#F4F6FA', haze, f * 0.8));
    }
  };
  const arch = (x, y, w, h, col, pier) => { // one span: deck on top, a pier on the left, shoulders of the arch
    px(x, y - h, w, 2, col); px(x, y - h, w, 1, mix(col, '#FFFFFF', 0.25));
    px(x, y - h + 2, pier, h - 2, col); px(x + pier, y - h + 2, 1, 1, col); px(x + w - 1, y - h + 2, 1, 1, col);
  };
  let behind = null;
  const cityBehind = (date, phase, season, theme) => {
    const key = [date, phase, season, theme].join('|');
    if (behind?.key === key) return behind.canvas;
    const night = phase !== 'day', haze = SKIES[phase][1], k = kitOf(theme), keep = ctx, L = landOf(date, season);
    const s = { t: 0, night, season, minute: 0 }, dim = (c) => shade(c, night ? 0.45 : 1);
    ctx = Object.assign(document.createElement('canvas'), { width: WIDTH, height: 270 }).getContext('2d');
    ranges(L, haze, night);
    const { rows, viaduct } = cityscape(WIDTH, HORIZON, GROUND - 12, L);
    const tops = rows.map((r) => Array.from({ length: WIDTH }, (_, x) => r.y - liftAt(L, x, r.k)));
    const treeType = (c, x) => L.biome === 'archipelago' ? 'palm' : L.biome === 'mesa' ? 'scrub'
      : L.biome === 'alpine' || L.biome === 'fjord' || (L.biome !== 'coast' && L.elev(x, 0.5) > 0.45) ? 'pine' : 'round';
    rows.forEach(({ y, k: depth, s: sc, pieces, river, bridge }, i) => {
      const fog = 0.35 + 0.5 * (1 - depth), f = (c) => mix(dim(c), haze, fog);
      const water = f(shade(k.water[night ? 'night' : 'day'], 1.5)), step = (rows[i + 1]?.y ?? GROUND) - y;
      for (let x = 0; x < WIDTH; x++) {
        const top = tops[i][x], c = L.cover(x, depth);
        if (c === 'water') { px(x, top, 1, GROUND - top, water); if (hash(`w${i}:${x}`) % 23 === 0) px(x, top + 1, 2, 1, mix(water, '#FFFFFF', 0.3)); continue; }
        const ground = c === 'meadow' ? GREEN[season][0] : c === 'forest' ? GREEN[season][1]
          : c === 'field' ? ['#C8B860', '#8FB050', '#B89A50'][((x >> 3) + (i >> 1)) % 3] : c === 'rock' && L.biome === 'mesa' ? '#B5653A' : COVER[c];
        const tilt = L.elev(x + 2, depth) - L.elev(x - 2, depth); // light from the left: slopes facing it are brighter
        const col = f(shade(ground, 1 - Math.max(-0.15, Math.min(0.2, tilt * 3))));
        px(x, top, 1, GROUND - top, col);
        px(x, top, 1, 1, mix(col, '#FFFFFF', 0.12));
        const drop = (tops[i + 1]?.[x] ?? GROUND) - top - step; // more than the usual row gap: a cliff face toward us
        if (drop > 3) {
          const [rock, line] = FACE[L.biome === 'mesa' ? 'mesa' : 'other'], face = (tops[i + 1]?.[x] ?? GROUND) - drop;
          px(x, face, 1, drop, f(rock));
          for (let yy = face + 2; yy < face + drop; yy += 3) px(x, yy, 1, 1, f(line));
        }
      }
      for (let x = 1; x < WIDTH - 1; x++) { // the wild: woods thick, a lone tree on open ground now and then
        const c = L.cover(x, depth), h = hash(`t${L.seed}:${i}:${x}`);
        const thick = c === 'forest' ? 2 + Math.round(3 * sc) : c === 'meadow' || c === 'sand' ? 40 : c === 'beach' && L.biome === 'archipelago' ? 14 : 0;
        if (thick && h % thick === 0) wildTree(x, tops[i][x] + 1, sc, treeType(c, x), season, f, h);
      }
      for (const p of pieces) sprite(k, p, sc, fog, haze, s);
      const stone = f('#D6CDB8'), span = 4 + Math.round(5 * depth);
      if (bridge) {
        const deck = Math.min(tops[i][Math.max(0, river.x - 1)], tops[i][Math.min(WIDTH - 1, river.x + river.w)]);
        for (let x = river.x - 2; x < river.x + river.w + 2; x += span) arch(x, deck + 1, span, 2 + Math.round(3 * depth), stone, 1);
      }
      if (i === viaduct.row) { // a level deck across the valley, piers down to the ground wherever it lies
        const deck = Math.min(...tops[i].slice(viaduct.from, viaduct.to)) - 5;
        for (let x = viaduct.from; x < viaduct.to; x += span + 2) {
          px(x, deck, span + 2, 2, mix(stone, '#FFFFFF', 0.1));
          px(x, deck + 2, 2, Math.max(0, tops[i][Math.min(WIDTH - 1, x)] - deck - 1), stone);
          px(x + 2, deck + 2, 1, 1, stone); px(x + span + 1, deck + 2, 1, 1, stone);
        }
      }
    });
    behind = { key, canvas: ctx.canvas }; ctx = keep;
    return behind.canvas;
  };

  // --- sun/moon clock: the body follows local time across the sky and carries the focus timer --------
  const FONT = { // 3x5 pixel digits, crisp at 4x
    0: '111101101101111', 1: '010110010010111', 2: '111001111100111', 3: '111001111001111', 4: '101101111001001',
    5: '111100111001111', 6: '111100111101111', 7: '111001010010010', 8: '111101111101111', 9: '111101111001111', ':': '01010',
  };
  const pixelText = (str, cx, y, color, s = 2) => { // centred on cx, each font pixel s×s, with a drop shadow
    const ws = [...str].map((ch) => FONT[ch].length / 5);
    let x = Math.round(cx - (s * (ws.reduce((a, b) => a + b + 1, 0) - 1)) / 2);
    [...str].forEach((ch, k) => {
      [...FONT[ch]].forEach((b, i) => {
        if (b !== '1') return;
        const gx = x + (i % ws[k]) * s, gy = y + Math.floor(i / ws[k]) * s;
        px(gx + 1, gy + 1, s, s, '#1E1E24'); px(gx, gy, s, s, color);
      });
      x += (ws[k] + 1) * s;
    });
  };
  const disc = (cx, cy, r, color) => {
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) if (dx * dx + dy * dy <= r * r + r) px(cx + dx, cy + dy, 1, 1, color);
  };
  // phase 0 new → 0.5 full → 1; waxing lit on the right (northern hemisphere), the dark side faintly visible
  const moon = (x, y, phase) => {
    if (phase == null) { disc(x, y, 6, '#E8E4D0'); px(x - 2, y - 2, 2, 2, '#C8C4B0'); px(x + 2, y + 1, 2, 2, '#C8C4B0'); px(x - 1, y + 3, 1, 1, '#C8C4B0'); return; }
    const r = 6, k = Math.cos(2 * Math.PI * phase);
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      if (dx * dx + dy * dy > r * r + r) continue;
      const u = dx / Math.sqrt(r * r + r - dy * dy), lit = phase < 0.5 ? u > k : -u > k;
      px(x + dx, y + dy, 1, 1, lit ? ((dx + dy) % 5 === 0 && Math.abs(dx) < 4 ? '#C8C4B0' : '#E8E4D0') : 'rgba(40,46,80,0.55)');
    }
  };
  const skyClock = (body, x, y, c, t, moonPhase) => {
    if (body === 'sun') { disc(x, y, 6, '#FFD27A'); disc(x - 1, y - 1, 4, '#FFE38A'); }
    else if (body === 'moon') moon(x, y, moonPhase);
    else { px(x - 2, y, 5, 1, '#FFFFFF'); px(x, y - 2, 1, 5, '#FFFFFF'); } // the brightest star
    if (!c) return;
    const left = c.leftMs / (c.phase.min * 60_000), color = c.phase.kind === 'focus' ? '#FFF1C1' : '#8FD18F';
    for (let k = 0; k < 44; k++) { // ring empties clockwise from the top as the block runs down
      const a = (k / 44) * 2 * Math.PI - Math.PI / 2;
      px(x + Math.cos(a) * 9, y + Math.sin(a) * 9, 1, 1, k / 44 < left ? color : 'rgba(255,255,255,0.2)');
    }
    const secs = Math.ceil(c.leftMs / 1000), mmss = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
    ctx.globalAlpha = c.paused ? 0.5 : 1; pixelText(mmss, x, y + 12, color); ctx.globalAlpha = 1; // paused: dimmed, never blinking
    const done = c.block.n - (c.phase.kind === 'focus' ? 1 : 0); // sessions: done ● · now ◉ · left ○
    for (let k = 0; k < c.block.of; k++) {
      const dx = x - (c.block.of * 4 - 2) / 2 + k * 4;
      const now = k === done && c.phase.kind === 'focus';
      px(dx, y + 25, 2, 2, k < done ? '#FFD27A' : now ? '#FEE761' : 'rgba(255,255,255,0.3)');
    }
  };

  // --- builders, trucks, buses ---------------------------------------------
  const builderSprite = (x, mode, t, jump = 0) => {
    const y = GROUND - 7 - jump, step = mode === 'walk' && Math.floor(t / 240) % 2;
    px(x, y, 3, 1, C.hat); px(x, y + 1, 3, 2, C.skin); px(x, y + 3, 3, 2, C.vest);
    px(x, y + 5, 1, 2, C.legs); px(x + 2, y + 5 + (step ? -1 : 0), 1, 2, C.legs);
    if (mode === 'hammer') px(x + 3, y + 2 + (Math.floor(t / 450) % 2), 1, 1, '#9A9A9A');
  };
  const vehicle = (x, color, long) => {
    const len = long ? 22 : 14;
    px(x, GROUND - 7, len, 5, color); px(x + len - 4, GROUND - 6, 3, 2, '#BFE3FF');
    if (long) for (let i = 2; i < len - 6; i += 4) px(x + i, GROUND - 6, 2, 2, '#BFE3FF');
    px(x + 2, GROUND - 2, 2, 2, '#1E1E1E'); px(x + len - 5, GROUND - 2, 2, 2, '#1E1E1E');
  };

  // --- state ---------------------------------------------------------------
  let scene = null, town = {}, lots = [], builders = [], sunPhase = null, timer = null, sunTimes = null, realSky = null, seenDone = null;
  const pieceKey = (id, at) => `${id}:${at}`;
  const walkers = new Map();   // id -> Walker
  const doneCounts = new Map(); // id -> finished floors, to spot a fresh !done and jump
  const jumps = new Map();      // id -> jump until (ms)
  const visitors = [];          // { x, kind: 'truck'|'bus', name, raiders, phase }
  const raiders = [];           // anonymous builders that came with a raid: { w, until }

  const onState = (msg, now) => {
    for (const [id, b] of Object.entries(msg.town)) {
      const n = b.floors.filter((f) => f.done).length;
      if (doneCounts.has(id) && n > doneCounts.get(id)) jumps.set(id, now + 1200);
      doneCounts.set(id, n);
    }
    if (!PINNED) setView(msg.view === 'bottom' ? '0' : 'city');
    const d = new Date(); // city view: the street leaves the river mouth open so the river reaches the bay
    lots = cityLayout(msg.town, WIDTH - 16, CITY ? mouthOf(d.toLocaleDateString('en-CA'), seasonOf(d.getMonth())) : undefined); // only changes with state
    const doneNow = new Set(lots.flatMap((l) => [
      ...(l.done ? [pieceKey(l.id, l.at)] : []), ...l.storeys.filter((s) => s.done).map((s) => pieceKey(s.id, s.at))]));
    if (seenDone) for (const k of doneNow) if (!seenDone.has(k)) reveals.set(k, Date.now());
    seenDone = doneNow;
    const wanted = msg.theme ?? null; // a new theme washes in as a tide (src/scene/theme.ts)
    scene = scene ? steer(scene, wanted, Date.now()) : settled(wanted);
    town = msg.town; builders = msg.builders; sunPhase = msg.phase ?? null; timer = msg.timer ?? null; sunTimes = msg.sun ?? null; realSky = msg.sky ?? null;
  };

  let last = performance.now();
  const frame = (t) => {
    const dt = Math.min(t - last, 500); last = t;
    const nowDate = new Date(), phase = sunPhase ?? phaseAt(nowDate.getHours()), season = seasonOf(nowDate.getMonth());
    const weather = weatherOn(nowDate.toLocaleDateString('en-CA'), season);
    const xOf = (l) => 8 + l.x;
    const baseOf = (l) => (l.row === 'back' ? GROUND - BACK : GROUND);
    const topOf = (l) => baseOf(l) - l.h - l.storeys.length * FH;
    const complete = (l) => l.done && l.storeys.every((s) => s.done);
    const roofs = lots.filter((l) => STACKABLE.has(l.kind) && complete(l));
    const tideNow = scene ? tide(scene, Date.now()) : 1, sweep = Math.round(tideNow * WIDTH);
    const kitAt = (x) => kitOf(x < sweep ? scene?.to : scene?.from); // left of the tide: the new theme
    const night = phase !== 'day', s = { t, night, season, minute: nowDate.getMinutes() };
    // street logic: lamps, boats, cart, balloon and the power line all switch through the circuit
    const built = lots.some((l) => l.done || l.storeys.some((x) => x.done));
    const on = evaluate(STREET, streetInputs({ night, weather, life: streetLife(lots), built }));

    ctx.clearRect(0, 0, WIDTH, 270);
    // the sky opens up as the city rises: it starts just above the rooftops and grows with the tallest tower
    const skyline = Math.max(0, ...lots.map((l) => GROUND - topOf(l)));
    const focus = current(timer, Date.now());
    const skyTop = BG ? 0 : Math.max(0, GROUND - skyline - (focus ? 75 : 30)); // a running timer keeps room for the sky clock
    const highY = skyTop + 12, lowY = CITY ? HORIZON - 30 : Math.max(highY, GROUND - skyline - 32);
    const skyBox = { width: WIDTH, top: highY, bottom: lowY }; // horizon sits just above the rooftops
    if (SKY) {
      ctx.globalAlpha = SKY_ALPHA; sky(skyTop, phase, weather, t, skyBox); ctx.globalAlpha = 1;
    }
    if (SKY && !BG) {
      const fade = ctx.createLinearGradient(0, skyTop, 0, skyTop + 40); // melt the sky's top edge into the camera, no hard line
      fade.addColorStop(0, 'rgba(0,0,0,1)'); fade.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalCompositeOperation = 'destination-out'; ctx.fillStyle = fade; ctx.fillRect(0, skyTop, WIDTH, 40);
      ctx.globalCompositeOperation = 'source-over';
    }
    if (CITY) ctx.drawImage(cityBehind(nowDate.toLocaleDateString('en-CA'), phase, season, scene?.to ?? null), 0, 0);
    // the far shore: faint towers across the bay, growing with the city; lit windows dotted at night
    const FAR = { day: '#A9BCD4', dawn: '#7C80AA', dusk: '#6E6A98', night: '#26304F' }, farH = 12 + skyline * 0.7;
    ctx.globalAlpha = 0.8;
    (CITY ? [] : farRow(WIDTH, Math.min(40, 6 + lots.length * 2), nowDate.toLocaleDateString('en-CA'))).forEach(({ x, w, k }, i) => {
      const h = Math.round(k * farH);
      px(x, GROUND - 6 - h, w, h + 6, FAR[phase]);
      if (phase !== 'day') for (let y = GROUND - 4 - h; y < GROUND - 6; y += 3) for (let c = x + 1; c < x + w - 1; c += 3)
        if ((c * 7 + y * 13 + i) % 5 === 0) px(c, y, 1, 1, '#B8A060');
    });
    ctx.globalAlpha = 1;
    // sun by day, moon by night, crossing the sky on local time (real sunrise/sunset with SUN_LAT/SUN_LON)
    const at = (h) => new Date(nowDate.getFullYear(), nowDate.getMonth(), nowDate.getDate(), h).getTime();
    let shadeRight, clockX = -99; // buildings show their shaded side away from the light
    if (realSky) { // real positions: the moon wherever it is, the timer on the brightest thing up (sun, moon, star)
      const c = carrier(realSky), edge = (p) => ({ x: Math.min(WIDTH - 20, Math.max(20, p.x)), y: p.y });
      if (realSky.moon.alt > 0 && c?.body !== 'moon') { const m = project(realSky.moon, skyBox); moon(m.x, m.y, realSky.moon.phase); }
      shadeRight = (c?.az ?? 180) < 180; // light from the east
      if (c) { const p = edge(project(c, skyBox)); clockX = p.x; skyClock(c.body, p.x, p.y, focus, t, realSky.moon.phase); }
    } else {
      const { body, f } = celestial(Date.now(), sunTimes ?? { sunrise: at(6), sunset: at(20) });
      shadeRight = f < 0.5;
      clockX = 20 + f * (WIDTH - 40);
      skyClock(body, clockX, lowY - Math.sin(Math.PI * f) * (lowY - highY), focus, t);
    }
    // the landmark in progress rises with the focus countdown
    const progress = focus?.phase.kind === 'focus' ? 1 - focus.leftMs / (focus.phase.min * 60_000) : 1;
    ctx = layer; ctx.clearRect(0, 0, WIDTH, 270);

    // ponytail: storeys go on the shortest tower forever; past ~25 storeys it reaches the top of the frame.
    const drawLot = (l) => {
      const x = xOf(l), base = baseOf(l), k = kitAt(x);
      const h = l.id === FOCUS_ID ? Math.max(3, Math.round(l.h * progress)) : l.h, seed = hash(pieceKey(l.id, l.at)) % 3000;
      const body = l.done ? k.body[l.kind] : [0, l.w, h, AIRY];
      if (body) depth(x, base, (l.done ? body[2] : h) + l.storeys.length * FH, body, l.done, shadeRight, night);
      l.done ? k.lots[l.kind](px, x, base, s) : scaffoldBox(x, base, l.w, h, t, seed);
      reveal(pieceKey(l.id, l.at), x, base, l.w, l.h, t, seed);
      l.storeys.forEach((st, i) => {
        const y = base - l.h - (i + 1) * FH, sseed = hash(pieceKey(st.id, st.at)) % 3000;
        st.done ? (k.storey[l.kind] ?? k.storey.office)(px, x, y, s) : scaffolding(x, y, t, sseed);
        reveal(pieceKey(st.id, st.at), x, y + FH, W, FH, t, sseed);
      });
      if (STACKABLE.has(l.kind) && complete(l)) k.roof(px, x, topOf(l), l.kind, t);
    };
    const mouth = CITY ? mouthOf(nowDate.toLocaleDateString('en-CA'), season) : null;
    oldTown(WIDTH - 16, nowDate.toLocaleDateString('en-CA'), lots, mouth ?? undefined).forEach((b, i) => kitAt(8 + b.x).oldHouse(px, { ...b, x: 8 + b.x }, GROUND - BACK, night, i));
    lots.filter((l) => l.row === 'back').forEach(drawLot);
    // light haze over the back row: depth, like towers seen across water
    ctx.globalCompositeOperation = 'source-atop'; ctx.fillStyle = 'rgba(150,170,205,0.22)'; ctx.fillRect(0, 0, WIDTH, GROUND);
    ctx.globalCompositeOperation = 'source-over';
    for (let x = 0; x < WIDTH; x++) { // promenade, then the bank down to the water's edge
      if (mouth && x >= mouth.x + 8 && x < mouth.x + 8 + mouth.w) { // the river mouth: the promenade crosses on arches
        const a = x - mouth.x - 8;
        px(x, GROUND, 1, 2, '#5A6988'); if (a % 2 === 0) px(x, GROUND - 1, 1, 1, '#5A6988'); // deck and railing
        if (a % 9 < 2) px(x, GROUND + 2, 1, SHORE[x] - GROUND, '#4A5670'); else if (a % 9 === 2 || a % 9 === 8) px(x, GROUND + 2, 1, 1, '#4A5670');
        continue;
      }
      px(x, GROUND, 1, 2, '#5A6988'); px(x, GROUND + 2, 1, SHORE[x] - GROUND - 2, '#4A5670');
      if (hash('rock' + x) % 11 === 0) px(x, SHORE[x] - 1, 1, 1, '#6B7890'); // a few stones on the edge
    }
    // the power line under the promenade: finished buildings tap into it, pulses run while it's live
    px(0, GROUND + 1, WIDTH, 1, '#3E4A66');
    if (on.power) {
      for (const l of lots) if (l.done) px(xOf(l) + Math.floor(l.w / 2), GROUND, 1, 2, '#FEE761');
      for (let i = 0; i < 4; i++) px(drift(30 + i * 7, t, WIDTH, 10), GROUND + 1, 2, 1, '#FEE761');
    }
    lots.filter((l) => l.row === 'front').forEach((l, i) => {
      drawLot(l);
      if (i % 4 === 3) lamp(xOf(l) + l.w + 2, on.lamps); // promenade furniture in some gaps, not a picket fence
      else if (i % 3 === 1) tree(px, xOf(l) + l.w, GROUND, season);
    });
    for (const [id, until] of wheres) {
      if (Date.now() > until) { wheres.delete(id); continue; }
      for (const l of lots) if (l.id === id || l.storeys.some((s) => s.id === id)) pointer(xOf(l) + Math.floor(l.w / 2), topOf(l) - 9, t);
    }
    const catAt = catRoof(roofs.length, Date.now());
    if (catAt !== null) cat(xOf(roofs[catAt]) + 3, topOf(roofs[catAt]) - 2, t);
    if (on.boats) for (const [x, color, dir, y] of [[drift(3, t, WIDTH, 6), '#4C9AFF', 1, GROUND + 14], [WIDTH - 10 - drift(5, t, WIDTH, 4), '#E4572E', -1, GROUND + 17]])
      kitAt(x).boat(px, x, y, color, dir, night);
    const cx = drift(11, t, WIDTH, 4);
    if (on.cart) kitAt(cx).cart(px, cx, GROUND);
    const bx = drift(7, t, WIDTH, 3);
    if (on.balloon && SKY && Math.abs(bx - clockX) > 24) kitAt(bx).balloon(px, bx, skyTop + 14, t); // never over the clock

    // builders: walk to your scaffolding and hammer, otherwise wander
    const ids = new Set(builders.map((b) => b.id));
    for (const id of walkers.keys()) if (!ids.has(id)) walkers.delete(id);
    for (const { id } of builders) {
      const site = lots.find((l) => (l.id === id && !l.done) || l.storeys.some((s) => s.id === id && !s.done));
      const home = site ? xOf(site) + site.w / 2 - 1 : null;
      const w = walkers.get(id) ?? { x: Math.random() * WIDTH, target: 0, mode: 'idle', until: 0 };
      const next = stepWalker(w, { dt, now: t, home, rand: Math.random, width: WIDTH - 4 });
      walkers.set(id, next);
      builderSprite(next.x, next.mode, t, (jumps.get(id) ?? 0) > Date.now() ? 2 : 0);
    }
    for (let i = raiders.length - 1; i >= 0; i--) {
      const r = raiders[i];
      if (Date.now() > r.until) { raiders.splice(i, 1); continue; }
      r.w = stepWalker(r.w, { dt, now: t, home: null, rand: Math.random, width: WIDTH - 4 });
      builderSprite(r.w.x, r.w.mode, t);
    }

    // visitors: delivery truck for a follow, a bus of builders for a raid
    for (let i = visitors.length - 1; i >= 0; i--) {
      const v = visitors[i];
      if (v.kind === 'bus' && v.phase === 'arrive' && v.x >= WIDTH / 2 - 11) { // stop, unload, leave
        v.phase = 'leave';
        for (let k = 0; k < Math.min(v.raiders, 12); k++) {
          raiders.push({ w: { x: v.x + 10, target: 0, mode: 'idle', until: 0 }, until: Date.now() + 10 * 60_000 });
        }
      }
      v.x += (dt / 1000) * (v.kind === 'truck' ? 40 : 30);
      if (v.x > WIDTH + 30) { visitors.splice(i, 1); continue; }
      vehicle(v.x, v.kind === 'truck' ? '#4C9AFF' : '#F2C230', v.kind === 'bus');
    }
    ctx = screen;
    // the river: dark water mirroring the skyline, squashed and rippling
    const water = (id) => kitOf(id).water[phase === 'day' ? 'day' : 'night'];
    px(0, GROUND + 2, sweep, 270 - GROUND - 2, water(scene?.to)); px(sweep, GROUND + 2, WIDTH - sweep, 270 - GROUND - 2, water(scene?.from));
    for (let y = 0; y < 270 - GROUND - 2; y++) {
      ctx.globalAlpha = 0.45 * (1 - y / 24);
      ctx.drawImage(layer.canvas, 0, GROUND - 1 - y * 2, WIDTH, 1, Math.round(Math.sin(t / 900 + y * 1.3)), GROUND + 2 + y, WIDTH, 1);
    }
    ctx.globalAlpha = 1;
    for (let i = 0; i < 6; i++) px(drift(20 + i, t, WIDTH, 2 + i), GROUND + 4 + ((i * 5) % 14), 3, 1, 'rgba(255,255,255,0.35)'); // glints
    ctx.filter = OUTLINE; ctx.drawImage(layer.canvas, 0, 0); ctx.filter = 'none';
    if (tideNow < 1) { // the tide line: a soft veil over the city and a foam line on the water
      px(sweep - 3, skyTop, 6, GROUND - skyTop, 'rgba(255,255,255,0.12)');
      px(sweep - 1, GROUND + 2, 2, 270 - GROUND - 2, 'rgba(255,255,255,0.6)');
    }
    requestAnimationFrame(frame);
  };

  let boot = null;
  new EventSource('/events').onmessage = (e) => {
    const msg = JSON.parse(e.data), now = Date.now();
    if (msg.boot && boot && msg.boot !== boot) return location.reload(); // bot restarted, maybe with new code
    boot = msg.boot ?? boot;
    if (msg.type === 'state') onState(msg, now);
    if (msg.type === 'where') wheres.set(msg.id, Date.now() + 8000);
    if (msg.type === 'follow') visitors.push({ kind: 'truck', x: -20, name: msg.name });
    if (msg.type === 'raid') visitors.push({ kind: 'bus', x: -30, name: msg.from, raiders: msg.viewers, phase: 'arrive' });
  };
  requestAnimationFrame(frame);
</script>
